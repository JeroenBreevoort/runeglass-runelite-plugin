plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = '1.13.1'
def pluginMainClass = 'com.runeglass.runelite.RuneGlassPluginTestClient'
def developmentMainClass = 'com.runeglass.runelite.RuneGlassDevelopmentClient'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.runeglass'
version = '1.2.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
	options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing'])
}

test {
	useJUnit()
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
	}
}

tasks.withType(Test).configureEach { task ->
	def testHome = layout.buildDirectory.dir("test-home/${task.name}").get().asFile
	systemProperty 'user.home', testHome.absolutePath
	systemProperty 'runeglass.testHome', testHome.absolutePath
	doFirst {
		testHome.deleteDir()
		testHome.mkdirs()
	}
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs '-ea'
	args '--developer-mode', '--debug'
}

// Development networking is compiled separately; the review/release sources
// and their fixed production destination are never modified by this task.
// Development-only controls live in src/development and are never part of the
// main/test outputs, the production jar, or the review export.
def developmentSources = layout.buildDirectory.dir('generated/development-java')
def developmentOnlySources = file('src/development/java')
tasks.register('prepareDevelopmentSources', Sync) {
	from('src/main/java')
	into developmentSources
	filter { line ->
		line.replace('https://fast-duck-448.eu-west-1.convex.site/',
			'https://small-cassowary-898.eu-west-1.convex.site/')
			.replace('internalName = "runeglass"', 'internalName = "runeglass-development"')
			.replace('legacyDataDirectory = "runeglass"', 'legacyDataDirectory = "runeglass-development"')
	}
}

sourceSets {
	development {
		java.srcDirs developmentSources, developmentOnlySources
		compileClasspath = configurations.testCompileClasspath
		runtimeClasspath = output + configurations.testRuntimeClasspath
	}
	developmentTest {
		compileClasspath = sourceSets.development.output + sourceSets.test.output + configurations.testCompileClasspath
		runtimeClasspath = output + compileClasspath + configurations.testRuntimeClasspath
	}
}
tasks.named('compileDevelopmentJava') {
	dependsOn 'prepareDevelopmentSources'
}
tasks.register('developmentTest', Test) {
	description = 'Runs tests for development-only RuneGlass controls.'
	group = 'verification'
	testClassesDirs = sourceSets.developmentTest.output.classesDirs
	classpath = sourceSets.developmentTest.runtimeClasspath
	useJUnit()
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
	}
}
tasks.register('verifyDevelopmentIsolation') {
	dependsOn 'developmentClasses', 'classes', 'testClasses', 'jar'
	doLast {
		['PairingClient', 'SnapshotClient', 'SemanticSnapshotClient', 'DropClient'].each { name ->
			def classPath = "com/runeglass/runelite/${name}.class"
			def productionClass = new File(sourceSets.main.output.classesDirs.singleFile, classPath).getText('ISO-8859-1')
			def developmentClass = new File(sourceSets.development.output.classesDirs.singleFile, classPath).getText('ISO-8859-1')
			assert productionClass.contains('https://fast-duck-448.eu-west-1.convex.site/')
			assert !productionClass.contains('small-cassowary-898')
			assert developmentClass.contains('https://small-cassowary-898.eu-west-1.convex.site/')
			assert !developmentClass.contains('fast-duck-448')
		}
		def pluginSourcePath = 'com/runeglass/runelite/RuneGlassPlugin.java'
		def productionSource = file("src/main/java/${pluginSourcePath}").getText('UTF-8')
		def developmentSource = developmentSources.get().file(pluginSourcePath).asFile.getText('UTF-8')
		assert productionSource.contains('internalName = "runeglass"')
		assert productionSource.contains('legacyDataDirectory = "runeglass"')
		assert developmentSource.contains('internalName = "runeglass-development"')
		assert developmentSource.contains('legacyDataDirectory = "runeglass-development"')
		assert !developmentSource.contains('"runeglass"')
		def pluginPath = 'com/runeglass/runelite/RuneGlassPlugin.class'
		def storageName = { String name -> new String([0, name.length()] as byte[], 'ISO-8859-1') + name }
		def productionPlugin = new File(sourceSets.main.output.classesDirs.singleFile, pluginPath).getText('ISO-8859-1')
		def developmentPlugin = new File(sourceSets.development.output.classesDirs.singleFile, pluginPath).getText('ISO-8859-1')
		assert productionPlugin.contains(storageName('runeglass'))
		assert !productionPlugin.contains('runeglass-development')
		assert developmentPlugin.contains(storageName('runeglass-development'))
		assert !developmentPlugin.contains(storageName('runeglass'))

		def developmentOnly = fileTree(developmentOnlySources).include('**/*.java').files.collect { it.name - '.java' }
		def productionClasses = files(sourceSets.main.output.classesDirs, sourceSets.test.output.classesDirs).asFileTree.files +
			zipTree(tasks.named('jar').get().archiveFile).files
		productionClasses.each { classFile ->
			def bytes = classFile.getText('ISO-8859-1')
			developmentOnly.each { name ->
				assert !classFile.name.startsWith(name) && !bytes.contains("com/runeglass/runelite/${name}") :
					"Development-only ${name} reached production output ${classFile.name}"
			}
		}
		developmentOnly.each { name ->
			assert new File(sourceSets.development.output.classesDirs.singleFile, "com/runeglass/runelite/${name}.class").exists()
		}
	}
}
tasks.named('test') {
	dependsOn 'verifyDevelopmentIsolation', 'developmentTest'
}
tasks.register('runDevelopment', JavaExec) {
	dependsOn 'verifyDevelopmentIsolation'
	classpath = sourceSets.development.runtimeClasspath
	mainClass = developmentMainClass
	jvmArgs '-ea'
	if (System.getProperty('os.name').toLowerCase().contains('mac')) {
		jvmArgs '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED'
	}
	args '--developer-mode', '--debug'
	doFirst {
		logger.lifecycle('RuneGlass DEVELOPMENT: small-cassowary-898; isolated plugin-data/runeglass-development storage; DEV drop test controls')
	}
}
tasks.register('previewDropTestPanel', JavaExec) {
	description = 'Opens the development-only drop test panel with fake outcomes; pass --args="--png <file>" to render offscreen.'
	dependsOn 'developmentClasses'
	classpath = sourceSets.development.runtimeClasspath
	mainClass = 'com.runeglass.runelite.DropTestPreview'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
